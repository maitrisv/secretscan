name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  self-scan:
    # Dogfooding: the scanner gates its own repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan this repo (fail on HIGH or above)
        run: python secretscan.py . --exclude-dir examples --exclude-dir tests --exclude-dir docs --fail-on HIGH -f markdown -o scan-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretscan-report
          path: scan-report.md
